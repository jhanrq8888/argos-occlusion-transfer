# ARGOS-11 - Configuracion del aumento de oclusion (V3) por bloque.
# Material pedido por la revision externa del 27/10 (observacion M4). Valores copiados de 07_entrenar.py (OCLUSION_CFG*),
# argos_lib/oclusion.py, argos_lib/siluetas.py, argos_lib/geometria.py, argos_lib/generativa.py y 35_dos_etapas.py (DOSIS).
# El aumento solo se aplica en el entrenamiento de V3, despues del aumento base (config/aumento_base.yaml, identico en V1 y
# V3) y antes del formateo. Lo siembra el cargador de Ultralytics por proceso y epoca (np.random) con la semilla de la corrida.
#   p          probabilidad de ocluir una imagen
#   personas   numero de personas ocluidas en una imagen ocluida (uniforme entre min y max, sin pasar de las validas)
#   cobertura  fraccion nominal de la caja cubierta por cada oclusor (uniforme)
#   min_lado   cajas con un lado menor (px) no se ocluyen

familias:
  parches:            # experimento 1 (H3), argos_lib/oclusion.py, OCLUSION_CFG
    p: 0.5
    personas: [1, 3]
    cobertura: [0.30, 0.85]
    tipo_de_parche: {textura: 0.4, recorte: 0.5, opaco: 0.1}
    min_lado: 8
  siluetas:           # H4, H4-Y26, H6, H7, H8, H10-s, H11, H12a, H15, H17; argos_lib/siluetas.py, OCLUSION_CFG_V2
    p: 0.5
    personas: [1, 3]
    cobertura: [0.30, 0.85]
    prob_silueta_de_persona: 0.5     # el resto, siluetas de objetos; las personas pegadas se etiquetan
    min_lado: 8
    banco: dataset/siluetas_train    # H6: siluetas_cp_train; H7: siluetas_no_train
  geometria_real:     # H10; argos_lib/geometria.py, OCLUSION_CFG_GEO (siluetas sobre la region oculta de patrones de CityPersons train)
    p: 0.5
    personas: [1, 3]
    cobertura: [0.40, 0.95]
    prob_silueta_de_persona: 0.5
  difusion:           # H9, H9b, H12b, H16a; imagenes ocluidas de antemano con Stable Diffusion 1.5 (OCLUSION_CFG_GEN)
    p_sustitucion_con_mosaico: 0.15      # ~0,48 por muestra de 4 imagenes
    p_sustitucion_sin_mosaico: 0.5
    cobertura_media_generada: ver dataset/generativa_train/indice.json
  profundidad:        # H14, H16b; objetos delante de la persona segun Depth Anything V2 (OCLUSION_CFG_PROF)
    p_sustitucion_con_mosaico: 0.15
    p_sustitucion_sin_mosaico: 0.5
    cobertura_media_generada: 0.52       # PREREGISTRO_H14.md

dosis_siluetas_H18:   # 35_dos_etapas.py, DOSIS; solo Faster R-CNN (H18a usa base; H18e baja y alta)
  base: {p: 0.5, personas: [1, 3], cobertura: [0.30, 0.85]}
  baja: {p: 0.25, personas: [1, 1], cobertura: [0.15, 0.40]}
  alta: {p: 1.0, personas: [1, 6], cobertura: [0.50, 0.95]}

control_sintetico:    # prueba del dominio de entrenamiento, todas las personas validas, oclusores no vistos en el entrenamiento
  cobertura: [0.70, 1.00]
  conjuntos: {parches: opaco_severa, siluetas: silueta_severa, geometria_real: geometria_severa,
              difusion: generativa_severa, profundidad: profundidad_severa, siluetas_CityPersons: cp_silueta_severa}
